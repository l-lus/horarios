name: Tests

on:
  push:
  pull_request:

# El token del workflow solo puede leer el repo: acá no se publica ni se modifica nada.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Fijadas por SHA, no por tag: un tag se puede mover a otro código. Las actualiza Dependabot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Sin scripts de instalación: la única dependencia (typescript) no los necesita
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
