name: Tests

on:
  push:
  pull_request:

# El token del workflow solo puede leer el repo: acá no se publica ni se modifica nada.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Fijadas por SHA, no por tag: un tag se puede mover a otro código. Las actualiza Dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Sin scripts de instalación: la única dependencia (typescript) no los necesita
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
